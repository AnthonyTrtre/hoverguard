name: Windows

on:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logique:
    name: Logique pure (Linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Tests de la logique pure
        run: dotnet test tests/Hoverguard.Tests -c Release

  windows:
    name: Compilation, tests et exe (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restauration
        run: dotnet restore
      - name: Compilation (Release)
        run: dotnet build -c Release --no-restore
      - name: Tests (dont l'exécution réelle des hooks PowerShell)
        run: dotnet test tests/Hoverguard.Tests -c Release --no-build --logger "console;verbosity=normal"
      - name: Exe autonome en un seul fichier
        run: dotnet publish src/Hoverguard/Hoverguard.csproj -c Release -r win-x64 -o publication
      - name: Test automatique sur le bureau du runner (voile, captures, clics, occlusion d'Edge)
        # Mesures sur un vrai Windows, mais sans vrai clavier, souris, webcam ni Windows Hello : informatif.
        continue-on-error: true
        timeout-minutes: 10
        shell: pwsh
        run: |
          $p = Start-Process -FilePath publication\Hoverguard.exe -ArgumentList '--autotest','autotest' -PassThru -Wait
          if (Test-Path autotest\resultats.txt) { Get-Content autotest\resultats.txt } else { Write-Host "Aucun résultat écrit." }
          exit $p.ExitCode
      - name: Installateur Velopack, installation silencieuse et premier lancement
        shell: pwsh
        timeout-minutes: 10
        run: |
          dotnet publish src/Hoverguard/Hoverguard.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=false -p:Version=0.0.1 -o application
          dotnet tool install -g vpk --version 1.2.161
          vpk pack --packId Hoverguard --packVersion 0.0.1 --packDir application --mainExe Hoverguard.exe --packTitle Hoverguard --packAuthors Utahpik --icon ressources/hoverguard.ico --outputDir velopack
          Get-ChildItem velopack | ForEach-Object { "$($_.Name)  $([math]::Round($_.Length/1MB,1)) Mo" }
          Start-Process velopack/Hoverguard-win-Setup.exe -ArgumentList '--silent' -Wait
          $installe = "$env:LOCALAPPDATA\Hoverguard\current\Hoverguard.exe"
          if (!(Test-Path $installe)) { throw "Hoverguard n'est pas installé dans $installe" }
          Get-Process Hoverguard -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          # Lancement à la main (comme un double-clic) : la fenêtre doit s'ouvrir.
          Start-Process $installe
          Start-Sleep 20
          $p = Get-Process Hoverguard -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle }
          if (!$p) { Get-Content "$env:LOCALAPPDATA\Utahpik\Hoverguard\journal.txt" -Tail 30 -ErrorAction SilentlyContinue; throw "Aucune fenêtre visible après un lancement à la main" }
          "Fenêtre ouverte : $($p.MainWindowTitle)"
          # Second double-clic : l'instance en cours doit rester seule et se montrer.
          Start-Process $installe
          Start-Sleep 5
          "Instances : $((Get-Process Hoverguard).Count)"
          Get-Content "$env:LOCALAPPDATA\Utahpik\Hoverguard\journal.txt" -Tail 10 -ErrorAction SilentlyContinue
          # Gardien : Hoverguard tué en pleine garde -> session verrouillée et Hoverguard relancé.
          Get-Process Hoverguard -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep 2
          $temoin = "$env:LOCALAPPDATA\Utahpik\Hoverguard\garde-en-cours"
          Set-Content $temoin (Get-Date -Format o)
          $leurre = Start-Process ping -ArgumentList '-n','60','127.0.0.1' -WindowStyle Hidden -PassThru
          $gardien = Start-Process $installe -ArgumentList '--gardien',$leurre.Id -PassThru
          Start-Sleep 3
          if ($gardien.HasExited) { throw "Le gardien s'est arrêté alors que la garde est posée" }
          Stop-Process -Id $leurre.Id -Force
          Start-Sleep 8
          $journal = Get-Content "$env:LOCALAPPDATA\Utahpik\Hoverguard\journal.txt" -Tail 15
          $journal
          if (-not ($journal -match "verrouillée par le gardien")) { throw "Le gardien n'a pas verrouillé la session" }
          if (-not (Get-Process Hoverguard -ErrorAction SilentlyContinue | Where-Object { $_.Id -ne $gardien.Id })) { throw "Hoverguard n'a pas été relancé" }
          "Gardien : session verrouillée et Hoverguard relancé"
      - name: Exe pour téléchargement
        uses: actions/upload-artifact@v4
        with:
          name: Hoverguard-windows-x64
          path: |
            windows/publication/Hoverguard.exe
          if-no-files-found: error
          retention-days: 7
      - name: Captures et mesures du test automatique
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autotest
          path: |
            windows/autotest/*.png
            windows/autotest/resultats.txt
          if-no-files-found: ignore
          retention-days: 7
